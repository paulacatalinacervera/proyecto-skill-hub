{% extends 'base.html' %}
{% block titulo %}Registro · SkillHub{% endblock %}
{% block contenido %}
<div class="form-caja">
  <h2>Crear cuenta</h2>
  <form method="post" novalidate>
    <label class="form-label" for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" class="form-control mb-3" required value="{{ request.form.get('nombre', '') }}">
    <label class="form-label" for="email">Correo</label>
    <input id="email" name="email" type="email" class="form-control mb-3" required value="{{ request.form.get('email', '') }}">
    <label class="form-label" for="password">Contraseña (mínimo 6 caracteres)</label>
    <input id="password" name="password" type="password" class="form-control mb-3" minlength="6" required>
    <label class="form-label" for="rol">Quiero…</label>
    <select id="rol" name="rol" class="form-select mb-4">
      <option value="cliente">Contratar servicios</option>
      <option value="postulante">Ofrecer mis habilidades</option>
    </select>
    <button class="btn btn-sh w-100">Registrarme</button>
  </form>
  <p class="text-center mt-3 mb-0 small">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Ingresa</a></p>
</div>
{% endblock %}
