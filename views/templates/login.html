{% extends 'base.html' %}
{% block titulo %}Ingresar · SkillHub{% endblock %}
{% block contenido %}
<div class="form-caja">
  <h2>Ingresar</h2>
  <form method="post" novalidate>
    <input type="hidden" name="siguiente" value="{{ siguiente }}">
    <label class="form-label" for="email">Correo</label>
    <input id="email" name="email" type="email" class="form-control mb-3" required autofocus>
    <label class="form-label" for="password">Contraseña</label>
    <input id="password" name="password" type="password" class="form-control mb-4" required>
    <button class="btn btn-sh w-100">Ingresar</button>
  </form>
  <p class="text-center mt-3 mb-0 small">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a></p>
</div>
{% endblock %}
